<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ingress Apollo Global Op Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #070a11;
        --card: #0f172a;
        --border: #1e293b;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --accent: #00f0ff;
        --accent-green: #00ff88;
      }

      body {
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 1rem;
        background-image: radial-gradient(
          circle at 50% 50%,
          rgba(0, 240, 255, 0.04) 0%,
          transparent 60%
        );
      }

      .container {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2.25rem;
        width: 100%;
        max-width: 480px;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
      }

      h1 {
        font-size: 1.35rem;
        text-align: center;
        margin-bottom: 1.75rem;
        color: var(--text);
        letter-spacing: -0.3px;
        font-weight: 700;
      }

      .form-group {
        margin-bottom: 1.25rem;
      }

      label {
        display: block;
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-bottom: 0.5rem;
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      select,
      input {
        width: 100%;
        padding: 0.85rem 1rem;
        background: #090e17;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 0.95rem;
        font-family: inherit;
        box-sizing: border-box;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      select:focus,
      input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.15);
      }

      .results {
        margin-top: 1.75rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
      }

      .result-row {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        padding: 0.85rem 1.15rem;
        background: #090e17;
        border-radius: 8px;
        border: 1px solid var(--border);
      }

      .result-row-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .result-label {
        font-size: 0.85rem;
        color: var(--text-muted);
        font-weight: 500;
      }

      .result-val {
        font-family: "JetBrains Mono", monospace;
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--accent-green);
      }

      .breakdown {
        font-size: 0.8rem;
        color: var(--accent);
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Ingress Apollo Global Op Planner</h1>

      <div class="form-group">
        <label for="numAgents">Agents</label>
        <select id="numAgents" onchange="calculate()">
          <option value="1">1 Agent</option>
          <option value="2">2 Agents</option>
          <option value="3">3 Agents</option>
          <option value="4" selected>4 Agents</option>
        </select>
      </div>

      <div class="form-group">
        <label for="modRarity">Max Mod Rarity (R)</label>
        <select id="modRarity" onchange="calculate()">
          <option value="very_rare" selected>
            Very Rare (8 Pts) → 2nd Mod: Rare (4 Pts)
          </option>
          <option value="rare">Rare (4 Pts) → 2nd Mod: Common (2 Pts)</option>
          <option value="common">Common (2 Pts) → Single Mod Only</option>
        </select>
      </div>

      <div class="form-group">
        <label for="targetPoints">Target Points (Per Agent)</label>
        <input
          type="number"
          id="targetPoints"
          value="1000"
          min="1"
          oninput="calculate()"
        />
      </div>

      <div class="results">
        <div class="result-row">
          <div class="result-row-header">
            <span class="result-label">Portals Required:</span>
            <span class="result-val" id="resPortals">0</span>
          </div>
        </div>
        <div class="result-row">
          <div class="result-row-header">
            <span class="result-label">Total Mods Required:</span>
            <span class="result-val" id="resTotalMods">0</span>
          </div>
        </div>
        <div class="result-row">
          <div class="result-row-header">
            <span class="result-label">Mods Required Per Agent:</span>
          </div>
          <div class="result-val breakdown" id="resModsPerAgent">-</div>
        </div>
      </div>
    </div>

    <script>
      function calculate() {
        const numAgents = parseInt(
          document.getElementById("numAgents").value,
          10,
        );
        const modRarityKey = document.getElementById("modRarity").value;
        const targetPoints =
          parseInt(document.getElementById("targetPoints").value, 10) || 0;

        if (targetPoints <= 0) {
          document.getElementById("resPortals").innerText = "0";
          document.getElementById("resTotalMods").innerText = "0";
          document.getElementById("resModsPerAgent").innerText = "0";
          return;
        }

        // Rarity configuration
        const rarityConfig = {
          very_rare: {
            rName: "Very Rare",
            rPts: 8,
            r1Name: "Rare",
            r1Pts: 4,
            hasR1: true,
          },
          rare: {
            rName: "Rare",
            rPts: 4,
            r1Name: "Common",
            r1Pts: 2,
            hasR1: true,
          },
          common: {
            rName: "Common",
            rPts: 2,
            r1Name: "None",
            r1Pts: 0,
            hasR1: false,
          },
        };

        const cfg = rarityConfig[modRarityKey];
        const bonusMap = { 1: 0, 2: 6, 3: 10, 4: 16 };

        let agents = Array.from({ length: numAgents }, (_, i) => ({
          id: i + 1,
          points: 0,
          modsR: 0,
          modsR1: 0,
          portalBonuses: {},
        }));

        let portals = [];
        let currentAgentIdx = 0;
        let steps = 0;
        const MAX_STEPS = 100000;

        while (
          !agents.every((a) => a.points >= targetPoints) &&
          steps < MAX_STEPS
        ) {
          steps++;
          let agent = agents[currentAgentIdx];

          // 1. Try to find an existing portal where agent can deploy 1st mod (Rarity R)
          let portal = portals.find(
            (p) => p.totalMods < 4 && (p.agentModCount[agent.id] || 0) === 0,
          );
          let isSecondMod = false;

          // 2. If no such portal, try to find an existing portal where agent can deploy 2nd mod (Rarity R-1)
          if (!portal && cfg.hasR1) {
            portal = portals.find(
              (p) => p.totalMods < 4 && (p.agentModCount[agent.id] || 0) === 1,
            );
            if (portal) {
              isSecondMod = true;
            }
          }

          // 3. If still no portal, create a new portal
          if (!portal) {
            portal = {
              id: portals.length + 1,
              totalMods: 0,
              agentModCount: {},
              uniqueAgents: new Set(),
              currentBonus: 0,
            };
            portals.push(portal);
            isSecondMod = false;
          }

          // Execute Deployment
          portal.totalMods++;
          portal.agentModCount[agent.id] =
            (portal.agentModCount[agent.id] || 0) + 1;
          portal.uniqueAgents.add(agent.id);

          if (isSecondMod) {
            agent.points += cfg.r1Pts;
            agent.modsR1++;
          } else {
            agent.points += cfg.rPts;
            agent.modsR++;
          }

          // Recalculate Portal Bonus
          const newBonus = bonusMap[portal.uniqueAgents.size] || 0;
          if (newBonus !== portal.currentBonus) {
            portal.uniqueAgents.forEach((aId) => {
              let ag = agents.find((a) => a.id === aId);
              let prevBonus = ag.portalBonuses[portal.id] || 0;
              ag.points += newBonus - prevBonus;
              ag.portalBonuses[portal.id] = newBonus;
            });
            portal.currentBonus = newBonus;
          }

          currentAgentIdx = (currentAgentIdx + 1) % numAgents;
        }

        // Calculate totals
        const totalR = agents.reduce((sum, a) => sum + a.modsR, 0);
        const totalR1 = agents.reduce((sum, a) => sum + a.modsR1, 0);
        const totalMods = totalR + totalR1;

        // Update UI
        document.getElementById("resPortals").innerText = portals.length;

        if (cfg.hasR1 && totalR1 > 0) {
          document.getElementById("resTotalMods").innerHTML =
            `${totalMods} <span class="breakdown">(${totalR} ${cfg.rName}, ${totalR1} ${cfg.r1Name})</span>`;
        } else {
          document.getElementById("resTotalMods").innerText =
            `${totalMods} ${cfg.rName}`;
        }

        // Per agent formatting
        const allEqual = agents.every(
          (a) => a.modsR === agents[0].modsR && a.modsR1 === agents[0].modsR1,
        );

        if (allEqual) {
          if (cfg.hasR1 && agents[0].modsR1 > 0) {
            document.getElementById("resModsPerAgent").innerText =
              `${agents[0].modsR} ${cfg.rName} + ${agents[0].modsR1} ${cfg.r1Name}`;
          } else {
            document.getElementById("resModsPerAgent").innerText =
              `${agents[0].modsR} ${cfg.rName}`;
          }
        } else {
          const perAgentStr = agents
            .map((a) => {
              if (cfg.hasR1 && a.modsR1 > 0) {
                return `Agent ${a.id}: ${a.modsR} ${cfg.rName} + ${a.modsR1} ${cfg.r1Name}`;
              }
              return `Agent ${a.id}: ${a.modsR} ${cfg.rName}`;
            })
            .join("\n");
          document.getElementById("resModsPerAgent").innerText = perAgentStr;
        }
      }

      calculate();
    </script>
  </body>
</html>
