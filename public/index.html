<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ingress Apollo Global Op Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #070a11;
        --card: #0f172a;
        --border: #1e293b;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --accent: #00f0ff;
        --accent-green: #00ff88;
      }

      body {
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 1rem;
        background-image: radial-gradient(
          circle at 50% 50%,
          rgba(0, 240, 255, 0.04) 0%,
          transparent 60%
        );
      }

      .container {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 2.25rem;
        width: 100%;
        max-width: 440px;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
      }

      h1 {
        font-size: 1.35rem;
        text-align: center;
        margin-bottom: 1.75rem;
        color: var(--text);
        letter-spacing: -0.3px;
        font-weight: 700;
      }

      .form-group {
        margin-bottom: 1.25rem;
      }

      label {
        display: block;
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-bottom: 0.5rem;
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      select,
      input {
        width: 100%;
        padding: 0.85rem 1rem;
        background: #090e17;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 0.95rem;
        font-family: inherit;
        box-sizing: border-box;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      select:focus,
      input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.15);
      }

      .results {
        margin-top: 1.75rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
      }

      .result-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.85rem 1.15rem;
        background: #090e17;
        border-radius: 8px;
        border: 1px solid var(--border);
      }

      .result-label {
        font-size: 0.85rem;
        color: var(--text-muted);
        font-weight: 500;
      }

      .result-val {
        font-family: "JetBrains Mono", monospace;
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--accent-green);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Ingress Apollo Global Op Planner</h1>

      <div class="form-group">
        <label for="numAgents">Agents</label>
        <select id="numAgents" onchange="calculate()">
          <option value="1">1 Agent</option>
          <option value="2">2 Agents</option>
          <option value="3">3 Agents</option>
          <option value="4" selected>4 Agents</option>
        </select>
      </div>

      <div class="form-group">
        <label for="modRarity">Mod Rarity</label>
        <select id="modRarity" onchange="calculate()">
          <option value="common">Common (2 Pts)</option>
          <option value="rare" selected>Rare (4 Pts)</option>
          <option value="very_rare">Very Rare (8 Pts)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="targetPoints">Target Points (Per Agent)</label>
        <input
          type="number"
          id="targetPoints"
          value="1000"
          min="1"
          oninput="calculate()"
        />
      </div>

      <div class="results">
        <div class="result-row">
          <span class="result-label">Portals Required:</span>
          <span class="result-val" id="resPortals">0</span>
        </div>
        <div class="result-row">
          <span class="result-label">Total Mods Required:</span>
          <span class="result-val" id="resTotalMods">0</span>
        </div>
        <div class="result-row">
          <span class="result-label">Mods Per Agent:</span>
          <span class="result-val" id="resModsPerAgent">0</span>
        </div>
      </div>
    </div>

    <script>
      function calculate() {
        const numAgents = parseInt(
          document.getElementById("numAgents").value,
          10,
        );
        const modRarity = document.getElementById("modRarity").value;
        const targetPoints =
          parseInt(document.getElementById("targetPoints").value, 10) || 0;

        if (targetPoints <= 0) {
          document.getElementById("resPortals").innerText = "0";
          document.getElementById("resTotalMods").innerText = "0";
          document.getElementById("resModsPerAgent").innerText = "0";
          return;
        }

        const modPointsMap = { common: 2, rare: 4, very_rare: 8 };
        const modPointValue = modPointsMap[modRarity];
        const bonusMap = { 1: 0, 2: 6, 3: 10, 4: 16 };

        let agents = Array.from({ length: numAgents }, (_, i) => ({
          id: i + 1,
          points: 0,
          modsDeployed: 0,
          portalBonuses: {},
        }));

        let portals = [];
        let currentAgentIdx = 0;
        let steps = 0;

        while (
          !agents.every((a) => a.points >= targetPoints) &&
          steps < 50000
        ) {
          steps++;
          let agent = agents[currentAgentIdx];

          // Find or create portal
          let portal = portals.find(
            (p) => p.totalMods < 4 && (p.agentModCount[agent.id] || 0) < 2,
          );
          if (!portal) {
            portal = {
              id: portals.length + 1,
              totalMods: 0,
              agentModCount: {},
              uniqueAgents: new Set(),
              currentBonus: 0,
            };
            portals.push(portal);
          }

          // Deploy
          portal.totalMods++;
          portal.agentModCount[agent.id] =
            (portal.agentModCount[agent.id] || 0) + 1;
          portal.uniqueAgents.add(agent.id);

          agent.points += modPointValue;
          agent.modsDeployed++;

          // Bonus recalculation
          const newBonus = bonusMap[portal.uniqueAgents.size] || 0;
          if (newBonus !== portal.currentBonus) {
            portal.uniqueAgents.forEach((aId) => {
              let ag = agents.find((a) => a.id === aId);
              let prev = ag.portalBonuses[portal.id] || 0;
              ag.points += newBonus - prev;
              ag.portalBonuses[portal.id] = newBonus;
            });
            portal.currentBonus = newBonus;
          }

          currentAgentIdx = (currentAgentIdx + 1) % numAgents;
        }

        const totalMods = agents.reduce((sum, a) => sum + a.modsDeployed, 0);
        const modsPerAgentStr = agents.map((a) => a.modsDeployed).join(", ");

        document.getElementById("resPortals").innerText = portals.length;
        document.getElementById("resTotalMods").innerText = totalMods;
        document.getElementById("resModsPerAgent").innerText = modsPerAgentStr;
      }

      calculate();
    </script>
  </body>
</html>
